<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ohrim Construct Portal</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo-section">
                <h1>🏗️ OHRIM CONSTRUCT</h1>
                <p>Portal Muncitori & Administrare</p>
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">👤 Utilizator</label>
                    <input type="text" id="username" name="username" required placeholder="Introduceți username">
                </div>
                
                <div class="form-group">
                    <label for="password">🔒 Parolă</label>
                    <input type="password" id="password" name="password" required placeholder="Introduceți parola">
                </div>
                
                <div class="form-group">
                    <label for="userType">👥 Tip Utilizator</label>
                    <select id="userType" name="userType" required>
                        <option value="worker">Muncitor</option>
                        <option value="admin">Administrator</option>
                    </select>
                </div>
                
                <button type="submit" class="btn-login">Autentificare</button>
                
                <div id="errorMessage" class="error-message" style="display: none;"></div>
            </form>
            
            <div class="demo-credentials">
                <h4>🔑 Conturi Demo:</h4>
                <p><strong>Muncitor:</strong> user: muncitor / pass: muncitor123</p>
                <p><strong>Admin:</strong> user: admin / pass: admin123</p>
            </div>
            
            <a href="index.html" class="back-link">← Înapoi la pagina principală</a>
        </div>
    </div>
    
    <script src="login.js"></script>
</body>
</html>
